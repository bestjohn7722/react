name: Lint and Format Auto-fix
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  autofix:
    if: |
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
    - name: Generate token
      id: generate_token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.PRIVATE_KEY }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG autofix entry (post-token)"
        printf '%s\n' "trigger_event=${{ toJSON(github.event.workflow_run.event) }}"
        printf '%s\n' "trigger_conclusion=${{ toJSON(github.event.workflow_run.conclusion) }}"
        printf '%s\n' "head_sha=${{ toJSON(github.event.workflow_run.head_sha) }}"
        printf '%s\n' "head_branch=${{ toJSON(github.event.workflow_run.head_branch) }}"
        printf '%s\n' "run_id=${{ toJSON(github.event.workflow_run.id) }}"
      continue-on-error: true
    - name: Get Pull Request
      id: pr
      uses: actions/github-script@5c56fde4671bc2d3592fb0f2c5b5bab9ddae03b1
      with:
        script: |
          const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: '${{ github.event.workflow_run.head_sha }}'
          });

          if (response.data.length === 0) {
            core.info('No pull request found for this commit');
            return;
          }

          const pr = response.data[0];
          core.setOutput('number', pr.number);
          core.setOutput('head_ref', pr.head.ref);
          core.setOutput('head_repo', pr.head.repo?.full_name || '');
    - name: Check which jobs failed
      id: check_jobs
      uses: actions/github-script@5c56fde4671bc2d3592fb0f2c5b5bab9ddae03b1
      with:
        script: |
          const jobs = await github.rest.actions.listJobsForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: ${{ github.event.workflow_run.id }}
          });

          const lintJob = jobs.data.jobs.find(job => job.name === 'lint');
          const formatJob = jobs.data.jobs.find(job => job.name === 'format');

          const lintFailed = lintJob && lintJob.conclusion === 'failure';
          const formatFailed = formatJob && formatJob.conclusion === 'failure';

          core.setOutput('lint_failed', lintFailed ? 'true' : 'false');
          core.setOutput('format_failed', formatFailed ? 'true' : 'false');
          core.setOutput('should_fix', (lintFailed || formatFailed) ? 'true' : 'false');

          if (lintFailed) {
            core.info('Lint job failed, will attempt auto-fix');
          }
          if (formatFailed) {
            core.info('Format job failed, will attempt auto-fix');
          }
          if (!lintFailed && !formatFailed) {
            core.info('Neither lint nor format jobs failed');
          }
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-checkout of attacker repo/ref"
        printf '%s\n' "pr_number=${{ toJSON(steps.pr.outputs.number) }}"
        printf '%s\n' "head_repo=${{ toJSON(steps.pr.outputs.head_repo) }}"
        printf '%s\n' "head_ref=${{ toJSON(steps.pr.outputs.head_ref) }}"
        printf '%s\n' "should_fix=${{ toJSON(steps.check_jobs.outputs.should_fix) }}"
        printf '%s\n' "lint_failed=${{ toJSON(steps.check_jobs.outputs.lint_failed) }}"
        printf '%s\n' "format_failed=${{ toJSON(steps.check_jobs.outputs.format_failed) }}"
      continue-on-error: true
    - name: Checkout PR branch
      if: steps.check_jobs.outputs.should_fix == 'true' && steps.pr.outputs.head_ref != ''
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ steps.pr.outputs.head_repo }}
        ref: ${{ steps.pr.outputs.head_ref }}
        token: ${{ steps.generate_token.outputs.token }}
        fetch-depth: 0
    - name: Set up Node.js
      if: steps.check_jobs.outputs.should_fix == 'true' && steps.pr.outputs.head_ref != ''
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-npm-ci sink"
        printf '%s\n' "cwd=$(pwd)"
        printf '%s\n' "head_ref=${{ toJSON(steps.pr.outputs.head_ref) }}"
        printf '%s\n' "head_repo=${{ toJSON(steps.pr.outputs.head_repo) }}"
        if [ -d .git ]; then git config --local --get-regexp 'http.*extraheader' || echo 'no persisted git extraheader'; else echo 'no .git directory present'; fi
        if [ -f package.json ]; then echo 'package.json present'; else echo 'package.json absent'; fi
      continue-on-error: true
    - name: Install dependencies
      if: steps.check_jobs.outputs.should_fix == 'true' && steps.pr.outputs.head_ref != ''
      run: npm ci
    - name: Run format auto-fix
      if: steps.check_jobs.outputs.format_failed == 'true' && steps.pr.outputs.head_ref != ''
      run: npm run format
    - name: Run lint auto-fix
      if: steps.check_jobs.outputs.lint_failed == 'true' && steps.pr.outputs.head_ref != ''
      run: |
        npm run lint:fix || true
        npm run lint:css:fix || true
    - name: Commit and push changes
      if: steps.check_jobs.outputs.should_fix == 'true' && steps.pr.outputs.head_ref != ''
      uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
      with:
        commit_message: 'chore: auto-fix lint and formatting issues'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - CI
    types:
    - completed

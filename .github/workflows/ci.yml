name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG ci.yml/format entry"
        printf '%s\n' "event_name=${{ toJSON(github.event_name) }}"
        printf '%s\n' "head_repo=${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
      continue-on-error: true
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Check for unformatted files
      run: npm run format:diff
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG ci.yml/lint entry"
        printf '%s\n' "event_name=${{ toJSON(github.event_name) }}"
        printf '%s\n' "repo=${{ toJSON(github.repository) }}"
        printf '%s\n' "ref=${{ toJSON(github.ref) }}"
        printf '%s\n' "head_ref=${{ toJSON(github.head_ref) }}"
        printf '%s\n' "head_repo=${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
      continue-on-error: true
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint JavaScript
      run: npm run lint
    - name: Lint CSS
      run: npm run lint:css
    - name: Lint markdown
      run: npm run lint:md
    - name: Lint npm packages
      run: npx turbo lint:npm
    - name: Check className test coverage
      run: npm run test:classname-coverage
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request: null
  merge_group:
    branches:
    - main
    types:
    - checks_requested
